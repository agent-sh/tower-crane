name: CI

on:
  pull_request:
    # No base filter: a stacked task's PR targets its lower task's branch, whatever its name.
  push:
    branches: [main]
    # A release tag runs the full matrix; the release gate reads the daily or a manual run.
    tags: ['v*']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      hang:
        description: 'Test only: block every shard runner so its watchdog dumps and stops it after 2 minutes'
        type: boolean
        default: false
      profile:
        description: 'Profile the suite against profile_baseline, three interleaved runs each, and run the mutation sample; nothing else runs'
        type: boolean
        default: false
      profile_baseline:
        description: 'The commit the suite profile compares this one with'
        type: string
        default: 'origin/main'

permissions:
  contents: read

# GitHub keeps one running and one pending run per group; a newer run replaces the pending one.
# Main pushes share one group: the newest pending head covers every earlier commit, and a running
# main run is never cancelled. Tag, scheduled and manual runs keep unique groups so none is replaced.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.ref == 'refs/heads/main' && github.event_name == 'push' && 'ci-main-push' || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tasks pass their tests gate (crucial and mapped suites) before submit, so same-repository PRs
  # and main pushes only validate the shared files. Fork PRs, release tags, daily and manual runs
  # run the full matrix, the repeats and the proofs.
  checks:
    name: checks (shared files)
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: npm run check:shared
        env:
          TOWER_CRANE_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }}, shard ${{ matrix.shard }})
    # A profile dispatch runs only the profile and mutation jobs.
    if: "!inputs.profile && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository))"
    runs-on: ${{ matrix.os }}
    # test/run.js splits shards by measured file time (test/durations.json). Three Windows shards
    # took 28 to 36 minutes, against test/run.js's 36-minute shard deadline, so Windows runs four.
    # This is a per-shard hang limit, not the suite deadline in scripts/suite-time.js; the runner
    # still bounds each test independently. The test step's own limit leaves time to upload its log.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
        node: [26, 24]
        shard: ['1/3', '2/3', '3/3']
        # Exclusions apply before inclusions, so Windows keeps only its four Node 26 shards.
        exclude:
          - { os: windows-latest }
        include:
          - { os: windows-latest, node: 26, shard: '1/4' }
          - { os: windows-latest, node: 26, shard: '2/4' }
          - { os: windows-latest, node: 26, shard: '3/4' }
          - { os: windows-latest, node: 26, shard: '4/4' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check:shared
        env:
          TOWER_CRANE_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      # The shard watchdog stops a hung run at 36 minutes; this limit ends the step if it cannot.
      - run: npm test
        timeout-minutes: 40
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-tests
          TC_TEST_SHARD: ${{ matrix.shard }}
          TC_TEST_SHARD_LOG_DIR: ${{ runner.temp }}/shard-log
          TC_TEST_SHARD_HANG: ${{ inputs.hang && '1' || '' }}
          TC_TEST_SHARD_DEADLINE_MIN: ${{ inputs.hang && '2' || '' }}
          # The daily and manual runs build the coverage map tests.map pins (test/run.js) on the
          # three Linux Node 26 shards, which together run every file.
          TC_TEST_COVERAGE_DIR: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.os == 'ubuntu-latest' && matrix.node == 26 && format('{0}/coverage', runner.temp) || '' }}
      # A job its limit cancels keeps no log; this keeps the file progress and the watchdog's dump.
      - name: Save shard progress
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shard-progress-${{ matrix.os }}-node-${{ matrix.node }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shard-log
          if-no-files-found: warn
      # A failing test still ran its code, so the shard's map is kept on any outcome but a cancel.
      - name: Save shard coverage map
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.os == 'ubuntu-latest' && matrix.node == 26 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-map-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/coverage/tests-coverage-map.json
          if-no-files-found: error

  # Joins the three shard maps into tests-coverage-map.json, which `tower-crane tests map refresh
  # --from-run RUN_ID` pins as tests.map after each daily run.
  coverage-map:
    name: coverage map
    needs: test
    if: ${{ !cancelled() && !inputs.profile && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Merge the shard maps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -p 'coverage-map-shard-*' -D "$RUNNER_TEMP/coverage-shards"
          node scripts/tests-coverage-map.js merge --expect 3 --out "$RUNNER_TEMP/tests-coverage-map.json" "$RUNNER_TEMP"/coverage-shards/*/tests-coverage-map.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-coverage-map
          path: ${{ runner.temp }}/tests-coverage-map.json
          if-no-files-found: error

  # Flake repeats for Windows-only races. They run in their own job so the test shards keep
  # an even, measured share of the suite.
  repeats:
    name: repeat (windows-latest, node 26)
    if: "!inputs.profile && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository))"
    runs-on: windows-latest
    # About 30 to 45 minutes: ten passes of the authority files take about 16, and twenty of the
    # interrupt backoff and origin read tests about 8.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      # First in the job, so its first pass makes the runner's first PowerShell CIM snapshot.
      - name: Repeat Claude Code mod wakeup twenty times
        shell: pwsh
        run: |
          foreach ($attempt in 1..20) {
            Write-Host "Claude Code mod wakeup: pass $attempt/20"
            npm test -- test/wakeups.test.js --test-name-pattern="the Claude Code mod pushes a decision answer and a worker message into the session"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-tests
      # A hung pass ends at the step limit, which leaves the job its log.
      - name: Repeat finite nested fork storm ten times
        timeout-minutes: 15
        shell: pwsh
        run: |
          foreach ($attempt in 1..10) {
            Write-Host "Finite nested fork storm: pass $attempt/10"
            npm test -- test/containment.test.js --test-name-pattern="finite nested fork storm"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-tests
      - name: Repeat Claude interrupted native worker ten times
        shell: pwsh
        run: |
          foreach ($attempt in 1..10) {
            Write-Host "Claude interrupted native worker: pass $attempt/10"
            npm test -- test/spawn-resume.test.js --test-name-pattern="claude interrupted native worker keeps dirty files and collects usage before redispatch"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-tests
      - name: Repeat lock-free reader and torn recovery tests thirty times
        shell: pwsh
        run: |
          foreach ($attempt in 1..30) {
            Write-Host "Lock-free reader and torn recovery: pass $attempt/30"
            npm test -- test/state-durability.test.js --test-name-pattern="keeps losing" --test-name-pattern="file ids pass" --test-name-pattern="torn"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-tests
      - name: Repeat owner authority and board approval files ten times
        shell: pwsh
        run: |
          foreach ($attempt in 1..10) {
            Write-Host "Owner authority and board approval files: pass $attempt/10"
            npm test -- test/authority.test.js test/approval-context.test.js test/board-controls.test.js test/windows-ancestry.test.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-tests
      - name: Repeat interrupt during backoff and origin read tests twenty times
        shell: pwsh
        run: |
          foreach ($attempt in 1..20) {
            Write-Host "Interrupt during backoff and origin read: pass $attempt/20"
            npm test -- test/interrupt.test.js test/spawn.test.js --test-name-pattern="interrupt during backoff cancels the retry" --test-name-pattern="a failed origin read is read again"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-tests

  gate-scratch:
    name: complete gate scratch cleanup proof
    # Same-repository PRs and main pushes skip the proofs; fork PRs, release tags, daily and manual runs keep them.
    if: "!inputs.profile && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository))"
    runs-on: ubuntu-latest
    # A failing head reruns the suite on the base: two runs at the suite deadline and setup.
    # check:shared holds this to scripts/suite-time.js.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: node scripts/probe-gate-scratch.js
        env:
          TOWER_CRANE_TEST_TMP: /home/runner/.cache/tower-crane-gate-proof
          TOWER_CRANE_PROOF_OUTPUT: ${{ runner.temp }}/gate-scratch-proof.json
      - name: Save gate scratch measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-scratch-proof
          path: ${{ runner.temp }}/gate-scratch-proof.json
          if-no-files-found: error

  model-swap:
    name: complete model swap proof
    # Same-repository PRs and main pushes skip the proofs; fork PRs, release tags, daily and manual runs keep them.
    if: "!inputs.profile && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository))"
    runs-on: ubuntu-latest
    # Leave setup time outside the probe's software-gate deadline; check:shared holds this to
    # scripts/suite-time.js.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: node scripts/probe-model-swap.js
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-model-swap
      - name: Show probe failures
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP/tower-crane-model-swap/model-swap-probe.tap"
      # The TAP keeps every test's duration, so a slow trend can be traced to its tests.
      - name: Save model swap TAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-swap-tap
          path: ${{ runner.temp }}/tower-crane-model-swap/model-swap-probe.tap
          if-no-files-found: warn

  # Dispatch only (inputs.profile): the suite at profile_baseline and at this commit, in turn,
  # three runs each on one runner, so both see the same machine. scripts/suite-profile.js exits 1
  # unless this commit's median CPU seconds and longest file are both lower. Six suite runs at
  # three file workers (test/run.js caps the request at one below the four cores).
  profile:
    name: suite profile against the baseline
    if: github.event_name == 'workflow_dispatch' && inputs.profile
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: node scripts/suite-profile.js --test-concurrency=12 --top 30 --baseline "$BASELINE" --runs 3 --json "$RUNNER_TEMP/suite-profile.json" 2>&1 | tee "$RUNNER_TEMP/suite-profile.log"
        # bash -o pipefail, so tee keeps the script's exit status.
        shell: bash
        env:
          BASELINE: ${{ inputs.profile_baseline }}
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-tests
      - name: Save suite profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: suite-profile
          path: |
            ${{ runner.temp }}/suite-profile.json
            ${{ runner.temp }}/suite-profile.log
          if-no-files-found: warn

  # Dispatch only (inputs.profile): every planted bug in scripts/mutants.js against the tests named for it.
  mutants:
    name: mutation sample
    if: github.event_name == 'workflow_dispatch' && inputs.profile
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: node scripts/mutants.js --no-full 2>&1 | tee "$RUNNER_TEMP/mutants.log"
        # bash -o pipefail, so tee keeps the script's exit status.
        shell: bash
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-tests
      - name: Save mutation sample
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-sample
          path: ${{ runner.temp }}/mutants.log
          if-no-files-found: warn
