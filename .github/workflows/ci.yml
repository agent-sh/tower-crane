name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }}${{ matrix.shard != '' && format(', shard {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    # Windows process startup can exceed the old job budget while tests pass;
    # the runner still bounds each test independently.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 26, shard: '' }
          - { os: ubuntu-latest, node: 24, shard: '' }
          - { os: windows-latest, node: 26, shard: '1/3' }
          - { os: windows-latest, node: 26, shard: '2/3' }
          - { os: windows-latest, node: 26, shard: '3/3' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check:shared
        env:
          TOWER_CRANE_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm test
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-tests
          TC_TEST_SHARD: ${{ matrix.shard }}

  model-swap:
    name: complete model swap proof
    runs-on: ubuntu-latest
    # Leave setup time outside the probe's 45-minute software-gate deadline.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: node scripts/probe-model-swap.js
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-model-swap
      - name: Show probe failures
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP/tower-crane-model-swap/model-swap-probe.tap"
