name: CI

on:
  pull_request:
    # No base filter: a stacked task's PR targets its lower task's branch, whatever its name.
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    # Full CLI suites use the same 45-minute bound as the software tests gate.
    # The runner still bounds each test independently.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The local tests gate covers Linux at every submitted head.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest"]' || '["ubuntu-latest","windows-latest"]') }}
        node: [26, 24]
        shard: ['1/3', '2/3', '3/3']
        exclude:
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check:shared
        env:
          TOWER_CRANE_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Repeat Claude Code mod wakeup twenty times
        if: matrix.os == 'windows-latest' && matrix.shard == '2/3'
        shell: pwsh
        run: |
          foreach ($attempt in 1..20) {
            Write-Host "Claude Code mod wakeup: pass $attempt/20"
            npm test -- test/wakeups.test.js --test-name-pattern="the Claude Code mod pushes a decision answer and a worker message into the session"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-tests
      - run: npm test
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-tests
          TC_TEST_SHARD: ${{ matrix.shard }}
      - name: Repeat Claude interrupted native worker ten times
        if: matrix.os == 'windows-latest' && matrix.shard == '1/3'
        shell: pwsh
        run: |
          foreach ($attempt in 1..10) {
            Write-Host "Claude interrupted native worker: pass $attempt/10"
            npm test -- test/spawn-resume.test.js --test-name-pattern="claude interrupted native worker keeps dirty files and collects usage before redispatch"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-tests
      - name: Repeat owner authority and board approval shard ten times
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $files = node -e "const r=require('./test/run.js'); const [i,n]=process.env.TC_TEST_SHARD.split('/').map(Number); const affected=new Set(['test/authority.test.js','test/approval-context.test.js','test/board-controls.test.js','test/windows-ancestry.test.js']); console.log(r.shardFiles(r.testFiles(),i,n).filter(f=>affected.has(f)).join(' '))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ([string]::IsNullOrWhiteSpace($files)) { exit 0 }
          $selected = $files.Trim().Split(' ')
          # The selected files already belong to this shard.
          Remove-Item Env:TC_TEST_SHARD
          foreach ($attempt in 1..10) {
            Write-Host "Owner authority and board approval shard: pass $attempt/10 ($files)"
            npm test -- @selected
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-tests
          TC_TEST_SHARD: ${{ matrix.shard }}

  windows-flake-repeat:
    name: repeat Windows flake cases ten times
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      # The cases run together, three files at a time, so each pass also loads the runner.
      - shell: pwsh
        run: |
          $files = @('test/supervision.test.js', 'test/live-spend.test.js', 'test/fallback.test.js', 'test/escalation.test.js', 'test/usage.test.js', 'test/spawn-exit.test.js', 'test/windows-process.test.js')
          $patterns = @(
            'keeps its lease without claimant writes', 'renews a short lease during backoff',
            'final session usage repairs', 'periodic sample that crosses the budget',
            'a detached switch wakes a live waiter', 'rework during a live fallback', 'research Claude fallback',
            'retries Windows sharing errors', 'completed processes cannot leave teardown', 'teardown', 'probe'
          ) | ForEach-Object { "--test-name-pattern=$_" }
          foreach ($attempt in 1..10) {
            Write-Host "Windows flake cases: pass $attempt/10"
            npm test -- @files @patterns
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-tests

  gate-scratch:
    name: complete gate scratch cleanup proof
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # The measurement must identify the submitted head, not GitHub's merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: node scripts/probe-gate-scratch.js
        env:
          TOWER_CRANE_TEST_TMP: /home/runner/.cache/tower-crane-gate-proof
          TOWER_CRANE_PROOF_OUTPUT: ${{ runner.temp }}/gate-scratch-proof.json
      - name: Save gate scratch measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-scratch-proof
          path: ${{ runner.temp }}/gate-scratch-proof.json
          if-no-files-found: error

  model-swap:
    name: complete model swap proof
    runs-on: ubuntu-latest
    # Leave setup time outside the probe's 45-minute software-gate deadline.
    timeout-minutes: 50
    steps:
      # The default checkout of a pull_request is the PR merged onto main, so the probe
      # runs on the merge result and finds its script even on a branch older than it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: node scripts/probe-model-swap.js
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-model-swap
      - name: Show probe failures
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP/tower-crane-model-swap/model-swap-probe.tap"
